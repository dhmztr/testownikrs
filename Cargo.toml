[package]
name = "testownik-rs"
version = "1.0.0"
edition = "2021"
authors = ["Kamil Golec <kumalgfilms@gmail.com>"]
description = "Aplikacja do rozwiązywania testów napisana w Rust"
license = "MIT"

[[bin]]
name = "testownik-rs"
path = "src/main.rs"

[lib]
name = "testownik_rs"
path = "src/lib.rs"

[dependencies]
encoding_rs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
iced = { version = "0.12", features = ["image", "tokio"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.17"

[dev-dependencies]
